quarkus.application.name=uatz-server
quarkus.http.port=8081

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=uatz
quarkus.datasource.password=uatz
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/uatz

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=uatz
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=uatz

quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true

quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,origin,x-requested-with
