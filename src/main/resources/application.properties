quarkus.application.name=uatz-server
quarkus.http.port=8081

# Datasource Configuration
database.url=${BASE:localhost:5432/uatz}
database.username=${USUARIO:uatz}
database.password=${SENHA:uatz}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${database.url}?ApplicationName=uatz-server
quarkus.datasource.username=${database.username}
quarkus.datasource.password=${database.password}

# O schema e versionado pelo projeto uatz-migration (Liquibase)
quarkus.hibernate-orm.packages=br.com.uatz.model
quarkus.hibernate-orm.database.generation=none

# As chaves NAO ficam no repositorio nem dentro do jar: `.keys/` esta no .gitignore
# e fora de src/main/resources. Gere o par local com o comando documentado no README.
# Em producao aponte JWT_*_KEY_LOCATION para o secret do provedor.
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:.keys/publicKey.pem}
mp.jwt.verify.issuer=uatz
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:.keys/privateKey.pem}
smallrye.jwt.new-token.issuer=uatz

quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true

quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,origin,x-requested-with

# WhatsApp Cloud API
# whatsapp.enabled=false mantem o envio apenas no log (desenvolvimento).
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
quarkus.rest-client.whatsapp-cloud-api.url=${WHATSAPP_API_URL:https://graph.facebook.com/v21.0}

#Custom properties
versao.app=0.0.1

# Perfil de teste. Sem Docker, o DevServices nao sobe o Postgres sozinho: aponte
# para um banco real ja com as migrations do uatz-migration aplicadas
# (generation=none, este projeto nunca gera schema). O app-secret liga a
# conferencia da assinatura do webhook para o WhatsAppWebhookTest.
%test.database.url=${BASE_TEST:localhost:5432/uatz_test}
%test.whatsapp.app-secret=test-app-secret
