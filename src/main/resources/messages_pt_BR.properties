# Mensagens de negocio. A chave e o nome do valor em
# br.com.uatz.server.exception.CloudMessage e o texto e o que a API devolve no
# campo "message" do ApiErrorResponse.
#
# Use {0}, {1}, ... para parametros e passe um Map na chamada do MessageBuilder.

# Autenticacao e usuarios
BOOTSTRAP_INDISPONIVEL=Bootstrap is no longer available
CREDENCIAIS_INVALIDAS=Invalid credentials
EMAIL_JA_EXISTE=Email already exists
PERFIL_NAO_ENCONTRADO=Role not found
USUARIO_NAO_ENCONTRADO=User not found

# Cadastros
CATEGORIA_NAO_ENCONTRADA=Category not found
CATEGORIA_PAI_NAO_ENCONTRADA=Parent category not found
CLIENTE_NAO_ENCONTRADO=Client not found
PRODUTO_NAO_ENCONTRADO=Product not found

# Fornecedores
FORNECEDOR_NAO_ENCONTRADO=Vendor not found
FORNECEDOR_INATIVO=Vendor is inactive
PERFIL_FORNECEDOR_NAO_ENCONTRADO=Vendor profile not found for current user
USUARIO_FORNECEDOR_NAO_ENCONTRADO=Vendor user not found
EMAIL_FORNECEDOR_OBRIGATORIO=Vendor email is required
SENHA_FORNECEDOR_OBRIGATORIA=Vendor password is required

# Pedido de orcamento e distribuicao
PEDIDO_NAO_ENCONTRADO=Budget request not found
REVISAO_SEM_ITENS=Review must contain at least one item
SITUACAO_NAO_ENCONTRADA=Status not found
NENHUM_FORNECEDOR_ELEGIVEL=No eligible vendors found for this request
FORNECEDOR_NAO_VINCULADO_PEDIDO=Vendor is not assigned to this request
FORNECEDOR_JA_RECUSOU_PEDIDO=Vendor has already declined this request
FORNECEDOR_JA_RESPONDEU_PEDIDO=Vendor has already responded to this request

# Fechamento do pedido
PEDIDO_JA_FECHADO=Budget request is already closed
PEDIDO_SEM_COTACOES_PARA_ENVIAR=Budget request has no quotes to send to the client
PEDIDO_SEM_OPCOES_ENVIADAS=Quote options were not sent to the client yet
PEDIDO_SEM_ESCOLHA=Budget request has no selected quote
OPCAO_COTACAO_NAO_ENCONTRADA=Selected option does not belong to this budget request

# Cotacao
COTACAO_NAO_ENCONTRADA=Vendor quote not found
COTACAO_USUARIO_NAO_ENCONTRADA=Vendor quote not found for current user
FORNECEDOR_JA_COTOU_PEDIDO=Vendor can quote this request only once
PEDIDO_SEM_ITENS_PARA_COTACAO=Budget request has no items available for quotation
ITEM_COTADO_NAO_PERTENCE_PEDIDO=Quoted item does not belong to this budget request
ITEM_COTADO_DUPLICADO=Quoted items must be unique
TODOS_ITENS_DEVEM_SER_COTADOS=All budget request items must be quoted
TOTAL_COTACAO_INVALIDO=Budget quote total must be greater than zero
